[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payload-heal"
version = "0.1.0"
description = "Production-ready self-healing Pydantic models for resilient JSON and GraphQL ingestion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Payload Heal Contributors" }
]
keywords = [
    "pydantic",
    "self-healing",
    "json",
    "graphql",
    "scraping",
    "schema-drift",
    "resilience",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
payload-heal = "payload_heal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["payload_heal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
